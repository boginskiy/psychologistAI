{{define "base"}}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .}}FRIEND{{end}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/custom.css" />
</head>
<body style="margin:0; min-height:100vh; display:flex; flex-direction:column; background:#f4f5f7; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:#1f2937;">

    <header style="background:#f4f5f7;">
        <div style="max-width:1300px; margin:0 auto; padding:28px 24px; display:flex; align-items:center; justify-content:space-between;">

             <!-- Логотип -->
            <a href="/" style="display:flex; align-items:center; gap:14px; text-decoration:none;">
                <div style="position:relative; width:40px; height:40px; display:flex; align-items:center; justify-content:center;">
                    <span style="font-size:36px; font-weight:700; color:#4c6fe0; line-height:1;">A</span>
                </div>
                <span style="font-family:'Poppins',sans-serif; font-size:22px; font-weight:600; letter-spacing:0.15em; color:#1e3a5f;">FRIEND</span>
            </a>

            <!-- Кнопка -->
            <a href="/login"
            style="background:#4c6fe0; color:#ffffff; height:40px; padding:0 30px; border-radius:8px; font-family:'Poppins',sans-serif; font-size:15px; font-weight:400; letter-spacing:0.02em; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; transition:background 0.15s;">
                LOG IN
            </a>

        </div>
    </header>

    <main style="flex:1; max-width:1100px; margin:0 auto; width:100%; padding:40px 24px;">
        {{block "content" .}}{{end}}
    </main>

    <footer style="padding:24px; text-align:center; font-size:13px; color:#6b7280;">
        <p style="margin:0;"> A loyal friend is here for you</p>
        <p style="margin:4px 0 0;">© 2025 friendAI</p>
    </footer>

</body>
</html>
{{end}}
