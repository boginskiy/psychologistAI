    <!-- ПОЛЕ ВВОДА -->
    <form method="POST" action="/chat" style="padding:0 20px 20px;">
        <div style="display:flex; gap:10px; align-items:center; background:#f4f6fa; border:1.5px solid transparent; border-radius:26px; padding:5px 5px 5px 22px; transition:all 0.2s;"
             onfocusin="this.style.borderColor='#4c6fe0'; this.style.background='#ffffff'; this.style.boxShadow='0 0 0 4px rgba(76,111,224,0.1)';"
             onfocusout="this.style.borderColor='transparent'; this.style.background='#f4f6fa'; this.style.boxShadow='none';">

                   name="message"
                   placeholder="Напишите сообщение..."
                   autocomplete="off"
                   style="flex:1; height:44px; border:none; background:transparent; font-family:'Poppins',sans-serif; font-size:14.5px; color:#0f172a; outline:none;" />

                    onmouseover="this.style.transform='scale(1.05)'; this.style.boxShadow='0 6px 16px rgba(76,111,224,0.4)';"
                    onmouseout="this.style.transform='scale(1)'; this.style.boxShadow='0 4px 12px rgba(76,111,224,0.3)';">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

            </button>

    </form>
