{{define "message_user"}}
<div style="max-width:80%; align-self:flex-end; text-align:right;">
    <div style="display:inline-block; text-align:left; background:linear-gradient(135deg, #5b7cfa 0%, #4a6fe0 100%); color:#ffffff; padding:14px 20px; border-radius:20px 6px 20px 20px; font-size:14.5px; line-height:1.55; letter-spacing:0.01em; box-shadow:0 6px 20px rgba(75,111,224,0.28), inset 0 1px 0 rgba(255,255,255,0.15);">
        {{.Text}}
    </div>
    <div style="font-size:11px; color:#c4cad6; margin-top:8px; margin-right:6px;">
        {{.Time}}
    </div>
</div>
{{end}}
