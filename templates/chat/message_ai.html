{{define "message_ai"}}
<div style="display:flex; gap:10px; max-width:80%; align-items:flex-start;">
    <div>
        <div style="background:#eef0f4; padding:14px 20px; border-radius:6px 20px 20px 20px; font-size:14.5px; line-height:1.55; letter-spacing:0.01em; color:#1f2937; box-shadow:0 2px 8px rgba(30,58,95,0.04), inset 0 1px 0 rgba(255,255,255,0.8);">
            {{.Text}}
        </div>
        <div style="font-size:11px; color:#c4cad6; margin-top:8px; margin-left:6px;">
            {{.Time}}
        </div>
    </div>
</div>
{{end}}
