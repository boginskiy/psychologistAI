{{define "title"}}FRIEND{{end}}

{{define "content"}}
<div style="width:100%; max-width:900px; height:calc(100vh - 260px); min-height:480px; background:#ffffff; border-radius:18px; border:1px solid #e4e8f0; box-shadow:0 8px 32px rgba(30,58,95,0.06), 0 2px 8px rgba(30,58,95,0.04); display:flex; flex-direction:column; overflow:hidden;">

    <!-- ШАПКА -->
    <div style="padding:22px 32px; border-bottom:1px solid #eef0f4; display:flex; align-items:center;">
        <!-- Вертикальная линия-якорь -->
        <div style="width:3px; height:22px; background:linear-gradient(180deg, #5b7cfa 0%, #a9b8e8 100%); border-radius:2px; margin-right:14px;"></div>
        <div style="font-family:'Poppins',sans-serif; font-size:15px; font-weight:500; color:#6b7280; letter-spacing:0.02em;">
            FRIEND
        </div>
    </div>

    <!-- ОБЛАСТЬ СООБЩЕНИЙ -->
    <div id="messages" style="flex:1; overflow-y:auto; padding:28px 28px 20px; display:flex; flex-direction:column; gap:22px; min-height:0;">
    
    
        <!-- Сообщение AI (стартовое приветствие)
        <div style="display:flex; gap:10px; max-width:80%; align-items:flex-start;">
            <div>
                <div style="background:#eef0f4; padding:14px 20px; border-radius:6px 20px 20px 20px; font-size:14.5px; line-height:1.55; letter-spacing:0.01em; color:#1f2937; box-shadow:0 2px 8px rgba(30,58,95,0.04), inset 0 1px 0 rgba(255,255,255,0.8);">
                    Привет. Как дела?
                </div>
                <div style="font-size:11px; color:#c4cad6; margin-top:8px; margin-left:6px;">
                    {{.Now}}
                </div>
            </div>
        </div> -->
        
        <!-- Сюда HTMX будет добавлять новые сообщения -->

        {{range .History}}
            {{if eq .Role "user"}}
                {{template "message_user" .}}
            {{else}}
                {{template "message_ai" .}}
            {{end}}
        {{end}}
    
    </div>


    <!-- ЧИПСЫ-ПОДСКАЗКИ
    <div style="padding:0 28px 12px; display:flex; gap:8px; flex-wrap:wrap;">
        <button type="button" style="padding:7px 14px; background:#f4f6fa; border:1px solid #e4e8f0; border-radius:18px; font-family:'Poppins',sans-serif; font-size:12.5px; color:#4c6fe0; cursor:pointer; transition:all 0.15s;"
                onmouseover="this.style.background='#4c6fe0'; this.style.color='#ffffff'; this.style.borderColor='#4c6fe0';"
                onmouseout="this.style.background='#f4f6fa'; this.style.color='#4c6fe0'; this.style.borderColor='#e4e8f0';">
            Тревога
        </button>
        <button type="button" style="padding:7px 14px; background:#f4f6fa; border:1px solid #e4e8f0; border-radius:18px; font-family:'Poppins',sans-serif; font-size:12.5px; color:#4c6fe0; cursor:pointer; transition:all 0.15s;"
                onmouseover="this.style.background='#4c6fe0'; this.style.color='#ffffff'; this.style.borderColor='#4c6fe0';"
                onmouseout="this.style.background='#f4f6fa'; this.style.color='#4c6fe0'; this.style.borderColor='#e4e8f0';">
            Не могу уснуть
        </button>
        <button type="button" style="padding:7px 14px; background:#f4f6fa; border:1px solid #e4e8f0; border-radius:18px; font-family:'Poppins',sans-serif; font-size:12.5px; color:#4c6fe0; cursor:pointer; transition:all 0.15s;"
                onmouseover="this.style.background='#4c6fe0'; this.style.color='#ffffff'; this.style.borderColor='#4c6fe0';"
                onmouseout="this.style.background='#f4f6fa'; this.style.color='#4c6fe0'; this.style.borderColor='#e4e8f0';">
            Плохой день
        </button>
    </div> -->

    <!-- ПОЛЕ ВВОДА -->
    <form hx-post="/chat"
        hx-target="#messages"
        hx-swap="beforeend"
        hx-on::after-request="this.reset(); document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;"
        style="padding:0 20px 20px;">
        <div style="display:flex; gap:10px; align-items:center; background:#f4f6fa; border:1.5px solid transparent; border-radius:26px; padding:5px 5px 5px 22px; transition:all 0.2s;"
            onfocusin="this.style.borderColor='#4c6fe0'; this.style.background='#ffffff'; this.style.boxShadow='0 0 0 4px rgba(76,111,224,0.1)';"
            onfocusout="this.style.borderColor='transparent'; this.style.background='#f4f6fa'; this.style.boxShadow='none';">

            <input type="text"
                name="message"
                placeholder="Напишите сообщение..."
                autocomplete="off"
                style="flex:1; height:44px; border:none; background:transparent; font-family:'Poppins',sans-serif; font-size:14.5px; color:#0f172a; outline:none;" />

            <button type="submit"
                    aria-label="Отправить"
                    style="width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg, #4c6fe0 0%, #6b8af0 100%); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 4px 12px rgba(76,111,224,0.3); transition:transform 0.15s, box-shadow 0.15s;"
                    onmouseover="this.style.transform='scale(1.05)'; this.style.boxShadow='0 6px 16px rgba(76,111,224,0.4)';"
                    onmouseout="this.style.transform='scale(1)'; this.style.boxShadow='0 4px 12px rgba(76,111,224,0.3)';">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </form>

</div>

<!-- Анимация для индикатора «печатает» -->
<style>
    @keyframes pulse {
        0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
        30% { opacity: 1; transform: translateY(-3px); }
    }
</style>
{{end}}
