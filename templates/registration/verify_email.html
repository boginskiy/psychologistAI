{{define "title"}}FRIEND{{end}}

{{define "header-actions"}}
<a href="/"
    style="background:#4c6fe0; color:#ffffff; min-width:115px; height:40px; padding:0 30px; border-radius:8px; font-family:'Poppins',sans-serif; font-size:15px; font-weight:400; letter-spacing:0.02em; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; transition:background 0.15s;"
    onmouseover="this.style.background='#1e3a5f'"
    onmouseout="this.style.background='#4c6fe0'"
    >
        BACK
</a>
{{end}}

{{define "content"}}
<div class="card w-96 bg-base-100 shadow-xl">
    <div class="card-body" style="padding:36px 32px; text-align:center;">

        <!-- Иконка конверта -->
        <div style="font-size:52px; line-height:1; margin-bottom:20px;">✉️</div>

        <!-- Заголовок -->
        <h2 style="font-family:'Poppins',sans-serif; font-size:26px; font-weight:600; color:#1e3a5f; margin:0 0 28px; line-height:1.2;">
            Проверьте почту
        </h2>

        <!-- Email в капсуле -->
        <div style="background:#e8eef7; border-radius:10px; padding:14px 18px; margin-bottom:28px;">
            <p style="font-family:'Poppins',sans-serif; font-size:16px; font-weight:500; color:#1e3a5f; margin:0; word-break:break-all;">
                {{.Email}}
            </p>
        </div>

        <!-- Что делать -->
        <p style="font-size:14px; color:#4b5563; line-height:1.6; margin:0 0 24px;">
            Мы отправили ссылку для подтверждения аккаунта.
            Она действует {{.LiveTimeToken}} минут.
        </p>

        <!-- Разделитель -->
        <div style="height:1px; background:#e5e7eb; margin-bottom:24px;"></div>

            <a href="/login"
                style="display:inline-flex; align-items:center; justify-content:center; width:100%; height:44px; background:#4c6fe0; color:#ffffff; border-radius:8px; font-family:'Poppins',sans-serif; font-size:15px; font-weight:500; text-decoration:none; transition:background 0.15s; box-sizing:border-box;"
                onmouseover="this.style.background='#1e3a5f'"
                onmouseout="this.style.background='#4c6fe0'">
                Войти
            </a>

        <div style="height:1px; background:#e5e7eb; margin:24px 0;"></div>


        <!-- Кнопка повторной отправки -->
        <form method="POST" action="/resend-verification" style="margin:0;">

            <input type="hidden" name="email" value="{{.Email}}" />
            <button type="submit"
                    style="display:inline-flex; align-items:center; justify-content:center; width:100%; height:44px; background:transparent; border:1.5px solid #1e3a5f; color:#1e3a5f; border-radius:8px; font-family:'Poppins',sans-serif; font-size:15px; font-weight:500; cursor:pointer; transition:all 0.15s; box-sizing:border-box; text-decoration:none;"
                    onmouseover="this.style.background='#1e3a5f'; this.style.color='#ffffff';"
                    onmouseout="this.style.background='transparent'; this.style.color='#1e3a5f';">
                Отправить письмо ещё раз
            </button>
        
        </form>

    </div>
</div>
{{end}}
